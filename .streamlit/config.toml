[theme]
# Moet overeenkomen met het donkere palet in ui/theme.py. Streamlit's
# eigen widgets (selectbox, invoervelden) gebruiken DEZE kleuren, niet
# onze CSS. Stond dit op "light" terwijl de pagina donker was, dan kreeg
# je witte invoervelden op een donkere achtergrond — onleesbaar.
base = "dark"
primaryColor = "#3dd6d0"
backgroundColor = "#080c14"
secondaryBackgroundColor = "#0f1620"
textColor = "#dce6f0"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# headless = true vereist op Streamlit Cloud (geen browser-popup poging)
headless = true
# Upload-limiet: een misvormd groot bestand kan het (ene) app-proces
# voor alle gebruikers laten omvallen. 100 MB is ruim voor CSV/Excel.
maxUploadSize = 100
# runOnSave uit voor Cloud (read-only filesystem op sommige paden)
runOnSave = false
# XSRF-bescherming aan (veiliger); CORS daarom op default laten.
enableXsrfProtection = true

[client]
showErrorDetails = true
